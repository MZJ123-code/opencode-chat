<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 咨询平台</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sidebar-width: 280px;
  --sidebar-bg: #1a1b2e;
  --sidebar-hover: #252742;
  --sidebar-active: #2d2f4a;
  --bg: #f0f2f5;
  --chat-bg: #fff;
  --user-bubble: #4f46e5;
  --ai-bubble: #f1f5f9;
  --ai-border: #e2e8f0;
  --text: #1e293b;
  --text-secondary: #64748b;
  --input-bg: #fff;
  --border: #e2e8f0;
  --danger: #ef4444;
  --success: #22c55e;
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  font-family: var(--font);
  background: var(--bg);
  height: 100vh;
  display: flex;
  overflow: hidden;
  color: var(--text);
}

/* ====== Sidebar ====== */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--sidebar-bg);
  color: #cbd5e1;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.sidebar-header {
  padding: 20px 16px;
  border-bottom: 1px solid #2d2f4a;
}

.sidebar-header h2 {
  font-size: 16px;
  font-weight: 600;
  color: #f1f5f9;
}

.btn-new-chat {
  width: 100%;
  padding: 10px;
  margin-top: 12px;
  border: 1px solid #4f46e5;
  background: #4f46e5;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  transition: background .15s;
}
.btn-new-chat:hover { background: #4338ca; }
.btn-new-chat:disabled { opacity: .5; cursor: not-allowed; }

.session-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.session-item {
  padding: 12px;
  margin-bottom: 4px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .12s;
  font-size: 14px;
  line-height: 1.4;
}
.session-item:hover { background: var(--sidebar-hover); }
.session-item.active { background: var(--sidebar-active); }
.session-item .title { color: #e2e8f0; font-weight: 500; }
.session-item .meta { color: #94a3b8; font-size: 12px; margin-top: 4px; }

/* ====== Main Chat Area ====== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-width: 0;
}

.chat-header {
  padding: 16px 24px;
  background: var(--chat-bg);
  border-bottom: 1px solid var(--border);
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  flex-shrink: 0;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  gap: 12px;
}

.empty-state-icon { font-size: 48px; opacity: .3; }
.empty-state-text { font-size: 16px; }
.empty-state-hint { font-size: 13px; opacity: .6; }

/* ====== Message Bubbles ====== */
.message {
  max-width: 72%;
  animation: fadeIn .2s ease;
}
.message.user { align-self: flex-end; }
.message.ai { align-self: flex-start; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.message .bubble {
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14.5px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}

.message.user .bubble {
  background: var(--user-bubble);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.message.ai .bubble {
  background: var(--ai-bubble);
  border: 1px solid var(--ai-border);
  border-bottom-left-radius: 4px;
}

.feedback-row {
  margin-top: 6px;
  display: flex;
  gap: 8px;
  padding-left: 4px;
}

.feedback-btn {
  background: none;
  border: 1px solid transparent;
  font-size: 16px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  transition: all .12s;
  color: var(--text-secondary);
  opacity: .5;
}
.feedback-btn:hover { opacity: 1; background: var(--ai-bubble); border-color: var(--ai-border); }
.feedback-btn.active { opacity: 1; color: var(--success); border-color: var(--success); background: #f0fdf4; }

.feedback-done {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
  padding-left: 4px;
}

/* ====== Typing Indicator ====== */
.typing-bubble {
  padding: 16px 20px;
  display: flex;
  gap: 6px;
  align-items: center;
  background: var(--ai-bubble);
  border: 1px solid var(--ai-border);
  border-radius: var(--radius);
  border-bottom-left-radius: 4px;
  max-width: 80px;
  align-self: flex-start;
}
.typing-bubble span {
  width: 8px;
  height: 8px;
  background: #94a3b8;
  border-radius: 50%;
  animation: bounce 1s infinite;
}
.typing-bubble span:nth-child(2) { animation-delay: .15s; }
.typing-bubble span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

/* ====== Input Area ====== */
.chat-input-area {
  padding: 16px 24px;
  background: var(--chat-bg);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 12px;
  flex-shrink: 0;
}

.chat-input-area textarea {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  font-family: var(--font);
  resize: none;
  min-height: 44px;
  max-height: 120px;
  outline: none;
  transition: border-color .15s;
  background: #f8fafc;
}
.chat-input-area textarea:focus { border-color: var(--user-bubble); background: var(--input-bg); }
.chat-input-area textarea:disabled { opacity: .5; cursor: not-allowed; }

.btn-send {
  padding: 10px 20px;
  background: var(--user-bubble);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background .15s;
  white-space: nowrap;
  align-self: flex-end;
}
.btn-send:hover { background: #4338ca; }
.btn-send:disabled { opacity: .5; cursor: not-allowed; }

/* ====== Error Banner ====== */
.error-banner {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 10px 20px;
  background: #fef2f2;
  color: var(--danger);
  font-size: 13px;
  text-align: center;
  animation: fadeIn .2s ease;
}
.error-banner .dismiss {
  margin-left: 12px;
  cursor: pointer;
  text-decoration: underline;
  opacity: .7;
}

/* ====== Mobile ====== */
@media (max-width: 640px) {
  .sidebar { display: none; }
  .sidebar.open {
    display: flex;
    position: fixed;
    z-index: 50;
    top: 0; left: 0;
    height: 100vh;
  }
  .chat-header { padding: 12px 16px; }
  .chat-messages { padding: 16px; }
  .chat-input-area { padding: 12px 16px; }
  .message { max-width: 85%; }

  .mobile-menu-btn {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    width: 32px; height: 32px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 18px;
    margin-right: 8px;
  }
}

.mobile-menu-btn { display: none; }

/* scrollbar */
.chat-messages::-webkit-scrollbar, .session-list::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-thumb, .session-list::-webkit-scrollbar-thumb {
  background: #cbd5e1; border-radius: 3px;
}
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>AI 咨询平台</h2>
    <button class="btn-new-chat" id="btnNewChat" onclick="newChat()">+ 新建对话</button>
  </div>
  <div class="session-list" id="sessionList"></div>
</aside>

<!-- Main -->
<main class="main">
  <div class="chat-header">
    <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
    <span id="chatTitle">选择或新建对话</span>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="empty-state">
      <div class="empty-state-icon">💬</div>
      <div class="empty-state-text">开始新的对话</div>
      <div class="empty-state-hint">点击左侧 "+ 新建对话" 开始咨询</div>
    </div>
  </div>
  <div class="chat-input-area">
    <textarea id="chatInput" placeholder="输入你的问题..." rows="1" disabled onkeydown="onInputKeydown(event)"></textarea>
    <button class="btn-send" id="btnSend" onclick="sendMessage()" disabled>发送</button>
  </div>
</main>

<div id="errorBanner"></div>

<script>
// ==================== State ====================
let currentSessionId = null;
let sessions = [];

// ==================== API Helpers ====================
async function api(method, url, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) {
    const { error } = await res.json().catch(() => ({}));
    throw new Error(error || `${res.status} ${res.statusText}`);
  }
  return res.json();
}

// ==================== UI Helpers ====================
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function showError(msg) {
  const banner = $('#errorBanner');
  banner.innerHTML = `<div class="error-banner">${msg} <span class="dismiss" onclick="this.parentElement.remove()">关闭</span></div>`;
  setTimeout(() => { if (banner.firstChild) banner.firstChild.remove(); }, 8000);
}

function scrollToBottom() {
  const el = $('#chatMessages');
  requestAnimationFrame(() => el.scrollTop = el.scrollHeight);
}

function setLoading(isLoading) {
  const input = $('#chatInput');
  const btn = $('#btnSend');
  input.disabled = isLoading;
  btn.disabled = isLoading;
  if (isLoading) {
    btn.textContent = '...';
  } else {
    btn.textContent = '发送';
    input.focus();
  }
}

function toggleSidebar() {
  $('#sidebar').classList.toggle('open');
}

// ==================== Session Management ====================
async function loadSessions() {
  try {
    sessions = await api('GET', '/api/sessions');
    renderSessionList();
    if (sessions.length > 0 && !currentSessionId) {
      selectSession(sessions[sessions.length - 1].sessionId);
    }
  } catch (e) {
    showError('加载会话列表失败: ' + e.message);
  }
}

function renderSessionList() {
  const container = $('#sessionList');
  if (sessions.length === 0) {
    container.innerHTML = '<div style="padding:16px;font-size:13px;color:#94a3b8;text-align:center">暂无对话</div>';
    return;
  }
  container.innerHTML = sessions.map(s => {
    const date = new Date(s.createdAt).toLocaleDateString('zh-CN');
    return `
      <div class="session-item ${s.sessionId === currentSessionId ? 'active' : ''}"
           onclick="selectSession('${s.sessionId}')">
        <div class="title">${escapeHtml(s.title)}</div>
        <div class="meta">${date} · ${s.messageCount || 0} 条消息</div>
      </div>
    `;
  }).join('');
}

async function newChat() {
  try {
    const btn = $('#btnNewChat');
    btn.disabled = true;
    btn.textContent = '创建中...';
    const { sessionId, title } = await api('POST', '/api/sessions', {});
    sessions.push({ sessionId, title, createdAt: Date.now(), messageCount: 0 });
    renderSessionList();
    selectSession(sessionId);
  } catch (e) {
    showError('创建对话失败: ' + e.message);
  } finally {
    const btn = $('#btnNewChat');
    btn.disabled = false;
    btn.textContent = '+ 新建对话';
  }
}

async function selectSession(sessionId) {
  currentSessionId = sessionId;
  renderSessionList();
  const meta = sessions.find(s => s.sessionId === sessionId);
  $('#chatTitle').textContent = meta?.title || '对话';
  $('#chatMessages').innerHTML = '';
  $('#chatInput').disabled = false;
  $('#btnSend').disabled = false;

  try {
    const messages = await api('GET', `/api/sessions/${sessionId}/messages`);
    renderMessages(messages);
  } catch (e) {
    showError('加载消息历史失败: ' + e.message);
  }
}

// ==================== Messages ====================
function renderMessages(messages) {
  const container = $('#chatMessages');
  container.innerHTML = '';
  if (!messages || messages.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">💬</div>
        <div class="empty-state-text">开始提问吧</div>
      </div>`;
    return;
  }
  container.innerHTML = messages.map((m, i) => {
    const text = (m.parts || []).join('\n');
    const isAI = m.role === 'assistant';
    let html = `<div class="message ${isAI ? 'ai' : 'user'}"><div class="bubble">${escapeHtml(text)}</div>`;
    if (isAI) {
      html += `
        <div class="feedback-row" data-msg-idx="${i}">
          <button class="feedback-btn" onclick="sendFeedback('${currentSessionId}', true, this)" title="满意">👍</button>
          <button class="feedback-btn" onclick="sendFeedback('${currentSessionId}', false, this)" title="不满意">👎</button>
        </div>`;
    }
    html += '</div>';
    return html;
  }).join('');
  scrollToBottom();
}

function appendUserMessage(text) {
  const container = $('#chatMessages');
  if (container.querySelector('.empty-state')) container.innerHTML = '';
  container.insertAdjacentHTML('beforeend', `
    <div class="message user"><div class="bubble">${escapeHtml(text)}</div></div>
  `);
  scrollToBottom();
}

function appendTyping() {
  $('#chatMessages').insertAdjacentHTML('beforeend', `
    <div class="typing-bubble" id="typing"><span></span><span></span><span></span></div>
  `);
  scrollToBottom();
}

function removeTyping() {
  const typing = $('#typing');
  if (typing) typing.remove();
}

function appendAIMessage(text, sessionId) {
  removeTyping();
  const msgCount = $('#chatMessages').querySelectorAll('.message.ai').length;
  $('#chatMessages').insertAdjacentHTML('beforeend', `
    <div class="message ai">
      <div class="bubble">${escapeHtml(text)}</div>
      <div class="feedback-row" data-msg-idx="${msgCount}">
        <button class="feedback-btn" onclick="sendFeedback('${sessionId}', true, this)" title="满意">👍</button>
        <button class="feedback-btn" onclick="sendFeedback('${sessionId}', false, this)" title="不满意">👎</button>
      </div>
    </div>
  `);
  scrollToBottom();

  // update message count in sidebar
  const s = sessions.find(s => s.sessionId === sessionId);
  if (s) { s.messageCount = (s.messageCount || 0) + 1; renderSessionList(); }
}

// ==================== Input & Send ====================
function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  const input = $('#chatInput');
  const message = input.value.trim();
  if (!message || !currentSessionId) return;

  input.value = '';
  input.style.height = 'auto';
  setLoading(true);
  appendUserMessage(message);
  appendTyping();

  try {
    const { reply } = await api('POST', '/api/chat', {
      sessionId: currentSessionId,
      message,
    });
    appendAIMessage(reply, currentSessionId);
  } catch (e) {
    removeTyping();
    showError('发送失败: ' + e.message);
  } finally {
    setLoading(false);
  }
}

// ==================== Feedback ====================
async function sendFeedback(sessionId, satisfied, btn) {
  const row = btn.parentElement;
  try {
    await api('POST', `/api/sessions/${sessionId}/feedback`, { satisfied });
    row.innerHTML = `<span class="feedback-done">${satisfied ? '👍 感谢反馈' : '👎 感谢反馈'}</span>`;
  } catch (e) {
    showError('提交反馈失败: ' + e.message);
  }
}

// ==================== Utils ====================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Auto-resize textarea
$('#chatInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ==================== Init ====================
loadSessions();
</script>
</body>
</html>
